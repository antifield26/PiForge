# PiForge gateway example config
# Copy to gateway.local.toml on the device; never commit secrets.

host = "127.0.0.1"
port = 8787
log_level = "info"

# OpenCode v2 server (localhost only)
opencode_url = "http://127.0.0.1:4096"

# SQLite (WAL + synchronous=NORMAL applied at open)
db_path = "/var/lib/piforge/wb.db"

# Service whitelist
services_allowlist = "/etc/piforge/services.allowlist.json"

# Session secret: set via systemd Environment=SESSION_SECRET=...
# session_secret is read from env, not this file.
